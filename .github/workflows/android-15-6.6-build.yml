name: Build A15-6.6
run-name: "Build A15-6.6 - KSU: ${{ inputs.kernelsu_variant }} | SUSFS: ${{ inputs.use_susfs }}"

permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions
  
on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "Kernel SU Variant"
        required: true
        type: choice
        options:
          - Official
          - Next
          - KowSU
          - ReSukiSU
          - MamboSU
          - MKSU
          - SukiSU
          - WKSU
        default: KowSU
      kernelsu_branch:
        description: "KSU Branch"
        required: true
        type: choice
        options:
          - Stable
          - Dev
        default: Dev
      kernelsu_custom_commit_hash:
        description: "KSU commit hash to apply to kernel. Use latest if you want to get latest commit"
        required: false
        type: string
        default: latest
      use_susfs:
        description: "Enable SUSFS4KSU"
        required: true
        type: boolean
        default: true
      use_superbuilders_susfs:
        description: "Use SuperBuilders' susfs4ksu patch"
        required: true
        type: boolean
        default: false
      use_enhanced_susfs:
        description: "Apply enhanced susfs4ksu patches"
        required: true
        type: boolean
        default: false
      
      use_zram:
        description: 'Add ZRAM'
        required: true
        type: boolean
        default: false
      use_kpm:
        description: 'Enable the KPM feature?'
        required: false
        type: boolean
        default: false
      BBG:
        description: "Enable kernel-level blocking of unauthorized writes to critical partitions/device nodes (LSM)？"
        required: true
        type: boolean
        default: true
      use_zeromount:
        description: "Enable ZeroMount VFS driver"
        required: true
        type: boolean
        default: false
      use_ccache:
        description: "Use CCache to cache the compilation result. This helps speed up later compile session, but requires a supported build script"
        required: false
        type: boolean
        default: true
      max_build_space:
        description: 'Maximize build space (should free around 30gb). Recommended if you need to use swap file'
        required: true
        type: boolean
        default: true
      use_swap:
        description: 'Use swap file to extend available ram'
        required: true
        type: boolean
        default: true
      custom_kernel_source:
        description: "Compile kernel from another source instead of rodin source. Use rodin if you want to use rodin src"
        required: false
        type: string
        default: 'https://github.com/tmnasd/smol-rodin-kernel.git --depth 1'
      defconfig_name:
        description: "Specify defconfig name to use to compile kernel source. Must exist in ./arch/arm64/configs"
        required: true
        type: string
        default: smol_defconfig
      custom_susfs_commit_hash:
        description: "Susfs4ksu custom commit hash. Use latest to get latest commit"
        required: false
        type: string
        default: latest
      
      clang_custom_link:
        description: "Clang link you want to use to compile the kernel"
        required: true
        type: string
        default: https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260129-release/Clang-23.0.0git-20260129.tar.gz
        
      use_bazel:
        description: "Use Bazel to build the kernel"
        required: true
        type: boolean
        default: false
      bazel_dist:
        description: "Bazel dist target. Skip if you don't use bazel"
        required: false
        type: string
        default: "//common:kernel_aarch64_dist"
      bazel_args:
        description: "Bazel custom args. Can skip"
        required: false
        type: string
        default: ""
jobs:
  build-kernel-a15-6-6-kernelsu-susfs:
    strategy:
      fail-fast: false
    uses: ./.github/workflows/gki-kernel.yml
    secrets: inherit
    with:
      clang_custom_link: ${{ inputs.clang_custom_link || 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android15-release/clang-r510928.tar.gz' }}
      android_version: "android15"
      kernel_version: "6.6"
      kernelsu_variant: ${{ inputs.kernelsu_variant || 'Next' }}
      kernelsu_branch: ${{ inputs.kernelsu_branch || 'Dev' }}
      kernelsu_custom_commit_hash: ${{ inputs.kernelsu_custom_commit_hash || 'latest' }}
      use_zram: ${{ inputs.use_zram }}
      use_kpm: ${{ inputs.use_kpm }}
      BBG: ${{ inputs.BBG || false }}
      custom_kernel_source: ${{ inputs.custom_kernel_source || 'rodin' }}
      custom_susfs_commit_hash: ${{ inputs.custom_susfs_commit_hash || 'latest' }}
      use_ccache: ${{ inputs.use_ccache }}  
      use_susfs: ${{ inputs.use_susfs }}
      use_enhanced_susfs: ${{ inputs.use_enhanced_susfs }}
      use_superbuilders_susfs: ${{ inputs.use_superbuilders_susfs }}
      use_zeromount: ${{ inputs.use_zeromount }}
      defconfig_name: ${{ inputs.defconfig_name }}
      max_build_space: ${{ inputs.max_build_space }}
      use_swap: ${{ inputs.use_swap }}
      use_bazel: ${{ inputs.use_bazel }}
      bazel_dist: ${{ inputs.bazel_dist }}
      bazel_args: ${{ inputs.bazel_args }}
